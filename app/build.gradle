plugins {
    id 'com.android.application'
}

// Read from ~/.gradle/gradle.properties, outside the repo. Tolerates the value being quoted or
// not, since buildConfigField needs a quoted Java literal either way.
def apodApiKey = (project.findProperty('APOD_API_KEY') ?: 'DEMO_KEY').toString().replaceAll('^"|"$', '')

android {
    compileSdk 37
    namespace "uk.co.jakelee.apodwallpaper"
    defaultConfig {
        applicationId "uk.co.jakelee.apodwallpaper"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 11
        versionName "1.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "java.util.Date", "BUILD_TIME", "new java.util.Date(" + System.currentTimeMillis() + "L)"
        // NASA's shared DEMO_KEY is heavily rate limited, but it keeps a clone building without
        // APOD_API_KEY in ~/.gradle/gradle.properties. Users can set their own key in settings.
        buildConfigField "String", "AUTH_CODE", "\"${apodApiKey}\""
        resConfigs "en"
    }

    buildFeatures {
        viewBinding true
        // Off by default from AGP 8; AUTH_CODE and BUILD_TIME are custom BuildConfig fields.
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The Kotlin stdlib comes from AGP's built-in Kotlin support, so it is not declared here.

    // Scheduling. 2.10.5 is the last release supporting minSdk 21; 2.11 requires 23.
    implementation "androidx.work:work-runtime-ktx:2.10.5"
    implementation "androidx.work:work-rxjava2:2.10.5"

    // Android UI libraries
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Additional UI libraries
    // 1.2.0 and 4.1.0 were only ever on jcenter; these are the first releases on Maven Central.
    implementation 'com.jsibbold:zoomage:1.3.1'
    implementation 'com.wdullaer:materialdatetimepicker:4.2.3'

    // Networking
    implementation 'com.squareup.okhttp3:okhttp:3.10.0'
    implementation 'com.google.code.gson:gson:2.8.2'

    // Threading. 2.2.21 and 2.1.1 are the final 2.x releases of each.
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // Logging
    implementation 'com.jakewharton.timber:timber:4.7.1'


}
