# Project build configuration. Secrets do not belong here - apod_api_key goes in
# ~/.gradle/gradle.properties, outside the repo, and the build falls back to NASA's DEMO_KEY
# without it.
android.useAndroidX=true
# Maps the remaining com.android.support:28 artifacts onto androidx. Removed once those are
# replaced with real androidx dependencies, since AGP 10 drops Jetifier entirely.
android.enableJetifier=true
